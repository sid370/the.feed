name: tick

# The only thing that advances the world, and the only thing that spends money. There is
# deliberately no HTTP endpoint that does this: the trigger is GitHub's scheduler or a
# workflow_dispatch, so the credential guarding it is repository write access rather than a
# secret riding on a request. DEPLOY.md §4.
on:
  schedule:
    # Hourly for now. Also a hosting dial — Neon stays awake ~5 min after each tick, so a
    # shorter interval never lets the database sleep. DEPLOY.md §1.
    #
    # TICK_INTERVAL_MINUTES below must match this. The scheduler divides opens_per_day by
    # ticks_per_day to get each character's per-tick chance of acting, so a cron that is
    # slower than the config does not merely halve the world — it halves the tick count and
    # halves each character's odds within a tick, on top of each other.
    - cron: "0 * * * *"
  workflow_dispatch:

# A tick collects the previous batch before submitting the next one. Two at once would
# submit from the same world state, which is the bug MAX_OPEN_BATCHES exists to prevent.
concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -m charsocial.worker.main tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          NEWS_ENABLED: "true"
          TICK_INTERVAL_MINUTES: "60"

  # The site has no runtime cache — every page is a static file, rebuilt here once the world
  # has moved. That is why an unbounded number of visitors costs nothing at all rather than a
  # bounded few queries, and why there is no KV write ceiling to think about.
  #
  # `needs: tick` rather than its own schedule: it must read a world that has already
  # advanced, and a failed tick should leave the last good site serving rather than redeploy
  # an unchanged one.
  deploy:
    needs: tick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run deploy
        working-directory: web
        env:
          # Read at build time: the 161 pages are prerendered against the real world here.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Wrangler's OAuth login is local-only, so CI authenticates with an API token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
