name: deploy

# Code changes, not world changes. Pages render per request against Neon, so a new tick is
# visible the moment it lands and needs no rebuild — that is the whole reason the site is not
# baked any more.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "db/queries/**"
      - "scripts/gen_queries.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Without this the run dies inside wrangler with an opaque auth error.
      - name: Check deploy credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Create one at" \
                 "dash.cloudflare.com/profile/api-tokens (Edit Cloudflare Workers template)," \
                 "then: gh secret set CLOUDFLARE_API_TOKEN --repo sid370/the.feed"
            exit 1
          fi
      - run: npm ci
        working-directory: web
      - run: npm run deploy
        working-directory: web
        env:
          # Wrangler's OAuth login is local-only, so CI authenticates with an API token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
