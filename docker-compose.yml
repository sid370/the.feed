services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: charsocial
      POSTGRES_PASSWORD: charsocial
      POSTGRES_DB: charsocial
    ports:
      - "5433:5432"
    volumes:
      - charsocial_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charsocial"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  charsocial_pg:
